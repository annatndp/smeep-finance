<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#FAF7F3" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Smeep" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" href="./icon-192.png" />
<link rel="apple-touch-icon" href="./apple-touch-icon.png" />
<title>Smeep Finance</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#FAF7F3; --card:#FFFFFF; --ink:#1B1B1F; --muted:#8A8694; --line:#EFEAE4; --div:#F5F1EB;
    --mint:#57C89B; --mint-deep:#2FA476;
    --btn:#1E1D22; --btn-ink:#FFFFFF; --keypress:#F4F0EA; --track:#F3EFE9;
    --navbg:#1E1D22; --navink:#A9A6B2; --empty:rgba(255,255,255,.6);
    --zero:#B9B4BE; --ph:#B4AFBA; --delbg:#FCEDED; --delink:#AC4A4A;
    --r-lg:24px; --r-md:16px;
    --shadow:0 2px 4px rgba(27,27,31,.04),0 14px 34px rgba(27,27,31,.08);
  }
  [data-theme="dark"]{
    --bg:#131217; --card:#1D1C23; --ink:#F1EFF4; --muted:#9B97A6; --line:#2B2933; --div:#28262F;
    --btn:#F1EFF4; --btn-ink:#17161C; --keypress:#2A2833; --track:#2B2933;
    --navbg:#232129; --navink:#8D8998; --empty:rgba(255,255,255,.04);
    --zero:#56535F; --ph:#6B6876; --delbg:rgba(244,99,99,.16); --delink:#E58C8C;
    --shadow:0 2px 4px rgba(0,0,0,.3),0 14px 34px rgba(0,0,0,.35);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
  html,body{ margin:0; height:100%; overflow:hidden; overscroll-behavior:none; }
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Inter",system-ui,sans-serif; -webkit-font-smoothing:antialiased; line-height:1.5;
    position:fixed; inset:0;
  }
  .scroll{ position:absolute; inset:0; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior-y:contain; }
  /* soft pastel wash, style ảnh 3-4 */
  body::before{
    content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
    background:
      radial-gradient(46% 34% at 12% 4%, rgba(246,167,124,.20), transparent 70%),
      radial-gradient(50% 38% at 92% 12%, rgba(180,156,245,.20), transparent 70%),
      radial-gradient(56% 42% at 50% 104%, rgba(87,200,155,.16), transparent 72%),
      var(--bg);
  }
  [data-theme="dark"] body::before{
    background:
      radial-gradient(46% 34% at 12% 4%, rgba(246,167,124,.10), transparent 70%),
      radial-gradient(50% 38% at 92% 12%, rgba(180,156,245,.11), transparent 70%),
      radial-gradient(56% 42% at 50% 104%, rgba(87,200,155,.09), transparent 72%),
      var(--bg);
  }
  html{ background:var(--bg); }
  button{ font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; padding:0; }
  button:focus-visible,input:focus-visible{ outline:2px solid var(--mint-deep); outline-offset:2px; }
  input{ font-family:inherit; }

  .app{ max-width:460px; margin:0 auto; padding:18px 18px 116px; }

  /* ---------- Header ---------- */
  .top{ display:flex; align-items:center; gap:10px; margin-bottom:18px; }
  .brandcol{ flex:1; min-width:0; }
  .brandcol .meta{ display:flex; align-items:center; gap:6px; font-family:"JetBrains Mono",monospace; font-size:10px; color:var(--muted); margin-top:1px; }
  .brandcol .meta .dotsep{ width:3px; height:3px; border-radius:50%; background:var(--muted); opacity:.5; }
  .synced{ color:var(--mint-deep); }
  .notice{ background:#FFF7E8; border:1px solid #F0DFB5; border-radius:14px; padding:13px 15px; margin-bottom:14px; font-size:13px; color:#6b5a2a; display:none; }
  .notice b{ color:#4a3d16; }
  [data-theme="dark"] .notice{ background:#2E2716; border-color:#4A3E1E; color:#D8BE83; }
  [data-theme="dark"] .notice b{ color:#EAD7A6; }
  .logo{ width:36px; height:36px; border-radius:12px; background:var(--btn); color:var(--btn-ink); display:flex; align-items:center; justify-content:center; font-family:"Bricolage Grotesque",sans-serif; font-weight:800; font-size:17px; box-shadow:var(--shadow); }
  .top h1{ font-family:"Bricolage Grotesque",sans-serif; font-weight:800; font-size:17.5px; letter-spacing:-.02em; margin:0; }
  .top .date{ font-family:"JetBrains Mono",monospace; font-size:12px; color:var(--muted); }
  .tbtn{ width:36px; height:36px; border-radius:12px; background:var(--card); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:15px; box-shadow:0 1px 2px rgba(27,27,31,.05); }
  .tbtn:active{ background:var(--keypress); }
  .top .demo{ font-family:"JetBrains Mono",monospace; font-size:10px; color:#B07A1E; background:#FFF3DE; border:1px solid #F1E0BD; padding:3px 8px; border-radius:999px; }

  .page{ display:none; }
  .page.on{ display:block; }

  /* ---------- ADD ---------- */
  .amount-zone{ text-align:center; padding:26px 0 20px; }
  .amount-zone .kr{ font-family:"JetBrains Mono",monospace; font-size:20px; color:var(--muted); margin-right:8px; vertical-align:14px; }
  .amount-zone .val{ font-family:"Bricolage Grotesque",sans-serif; font-weight:700; font-size:64px; letter-spacing:-.04em; line-height:1; font-variant-numeric:tabular-nums; }
  .amount-zone .val.zero{ color:var(--zero); }

  .catgrid{ display:grid; grid-template-columns:repeat(3,1fr); gap:9px; margin-bottom:10px; }
  .catgrid .catbtn{ padding:13px 6px; font-size:13px; }
  .cardrow{ display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-bottom:12px; }
  .cardrow .catbtn{ padding:11px 10px; font-size:13px; }
  .cardrow .catbtn.on.amex{ background:#5EA0E6; border-color:#5EA0E6; color:#fff; }
  .catbtn{ display:flex; align-items:center; justify-content:center; gap:8px; background:var(--card); border:1px solid var(--line); border-radius:var(--r-md); padding:14px 10px; font-size:14px; font-weight:600; box-shadow:0 1px 2px rgba(27,27,31,.03); transition:transform .08s ease; }
  .catbtn:active{ transform:scale(.97); }
  .catbtn .cdot{ width:8px; height:8px; border-radius:50%; flex:0 0 auto; }
  .catbtn.on{ background:var(--btn); border-color:var(--btn); color:var(--btn-ink); }

  .notewrap{ margin-bottom:16px; }
  .notewrap input{ width:100%; background:var(--card); border:1px solid var(--line); border-radius:var(--r-md); padding:14px 16px; font-size:14px; color:var(--ink); }
  .notewrap input::placeholder{ color:var(--ph); font-family:"JetBrains Mono",monospace; font-size:12.5px; }

  .daterow{ display:flex; gap:9px; margin-bottom:12px; }
  .datewrap{ position:relative; flex:1; display:flex; align-items:center; gap:8px; background:var(--card); border:1px solid var(--line); border-radius:var(--r-md); padding:11px 14px; font-size:13px; font-weight:600; overflow:hidden; }
  .datewrap.other{ border-color:var(--mint); background:color-mix(in srgb, var(--mint) 10%, var(--card)); }
  .datewrap input[type="date"]{ position:absolute; inset:0; opacity:0; width:100%; height:100%; border:0; }
  .datewrap .dico{ font-size:14px; }
  .dreset{ flex:0 0 auto; background:var(--card); border:1px solid var(--line); border-radius:var(--r-md); padding:11px 14px; font-size:12.5px; font-weight:600; color:var(--muted); }
  .dreset:active{ background:var(--keypress); }

  .flowcard{ background:var(--card); border:1px solid var(--line); border-radius:var(--r-lg); box-shadow:var(--shadow); padding:14px 16px 13px; margin-bottom:9px; }
  .fhead{ display:flex; align-items:center; gap:8px; margin-bottom:9px; }
  .fhead .pi{ width:20px; height:20px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-size:10px; font-weight:800; color:#fff; }
  .fhead .fname{ flex:1; font-size:14.5px; font-weight:700; }
  .fhead .fpay{ font-family:"JetBrains Mono",monospace; font-size:10.5px; color:var(--muted); background:var(--track); border-radius:999px; padding:4px 9px; }
  .fhead .fpay.on{ color:var(--mint-deep); background:color-mix(in srgb, var(--mint) 18%, transparent); }
  .frow{ display:flex; justify-content:space-between; align-items:baseline; font-size:13px; color:var(--muted); padding:4px 0; }
  .frow b{ color:var(--ink); font-weight:600; font-variant-numeric:tabular-nums; }
  .frow.in b{ color:var(--mint-deep); font-weight:700; }
  .frow.tot{ border-top:1px solid var(--div); margin-top:6px; padding-top:9px; color:var(--ink); font-weight:700; font-size:14px; }
  .frow.tot b{ font-family:"Bricolage Grotesque",sans-serif; font-weight:800; font-size:19px; letter-spacing:-.02em; }
  .fmini{ display:flex; align-items:center; gap:9px; margin-top:10px; }
  .fbar{ flex:1; height:6px; border-radius:999px; background:var(--track); overflow:hidden; display:block; }
  .ffill{ display:block; height:100%; border-radius:999px; }
  .fnote{ font-family:"JetBrains Mono",monospace; font-size:10px; color:var(--muted); white-space:nowrap; }
  .fnote b{ color:var(--ink); }
  .flowtot{ display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; background:var(--track); border-radius:var(--r-md); padding:12px 16px; margin-bottom:14px; font-size:13px; font-weight:700; }
  .flowtot b{ font-family:"Bricolage Grotesque",sans-serif; font-weight:800; font-size:19px; letter-spacing:-.02em; font-variant-numeric:tabular-nums; }
  .flowtot .fl{ flex-basis:100%; font-size:11px; font-weight:500; color:var(--muted); }

  .pad{ display:grid; grid-template-columns:repeat(3,1fr); gap:9px; margin-bottom:14px; }
  .key{ background:var(--card); border:1px solid var(--line); border-radius:var(--r-md); font-family:"Bricolage Grotesque",sans-serif; font-weight:600; font-size:24px; padding:16px 0; box-shadow:0 1px 2px rgba(27,27,31,.03); transition:transform .07s ease, background .07s ease; }
  .key:active{ transform:scale(.95); background:var(--keypress); }

  .addbtn{ width:100%; display:flex; align-items:center; justify-content:center; gap:9px; background:var(--btn); color:var(--btn-ink); font-weight:700; font-size:16px; padding:17px; border-radius:18px; box-shadow:0 12px 26px rgba(30,29,34,.22); transition:transform .08s ease, opacity .15s; }
  .addbtn:active{ transform:scale(.98); }
  .addbtn:disabled{ opacity:.35; box-shadow:none; }
  .addbtn .ret{ font-family:"JetBrains Mono",monospace; font-size:12px; background:color-mix(in srgb, var(--btn-ink) 14%, transparent); padding:2px 8px; border-radius:7px; }
  .addbtn.done{ background:var(--mint-deep); color:#fff; }

  /* ---------- BUDGET ---------- */
  .budget{ background:var(--card); border:1px solid var(--line); border-radius:var(--r-lg); box-shadow:var(--shadow); padding:16px 16px 15px; margin-bottom:14px; }
  .b-top{ display:flex; justify-content:space-between; align-items:baseline; }
  .b-name{ font-size:13.5px; font-weight:700; }
  .b-cap{ font-family:"JetBrains Mono",monospace; font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .b-left{ font-family:"Bricolage Grotesque",sans-serif; font-weight:800; font-size:27px; letter-spacing:-.025em; margin:3px 0 11px; font-variant-numeric:tabular-nums; }
  .b-left.ok{ color:var(--mint-deep); }
  .b-left.warn{ color:#C77E1D; }
  .b-left.over{ color:#D64B4B; }
  .bbar{ position:relative; height:12px; border-radius:999px; background:var(--track); margin-bottom:10px; }
  .bfill{ position:absolute; left:0; top:0; bottom:0; border-radius:999px; min-width:4px; }
  .bfill.ok{ background:var(--mint); }
  .bfill.warn{ background:#E8A13C; }
  .bfill.over{ background:#E15B5B; }
  .btick{ position:absolute; top:-4px; bottom:-4px; width:2px; border-radius:2px; background:var(--ink); opacity:.5; }
  .btick::after{ content:"today"; position:absolute; top:-15px; left:50%; transform:translateX(-50%); font-family:"JetBrains Mono",monospace; font-size:8.5px; color:var(--muted); }

  .abudget{ display:flex; align-items:center; gap:11px; background:var(--card); border:1px solid var(--line); border-radius:var(--r-md); padding:11px 14px; margin-bottom:12px; font-size:12px; color:var(--muted); box-shadow:0 1px 2px rgba(27,27,31,.03); }
  .abudget .atxt{ flex:0 0 auto; white-space:nowrap; }
  .abudget b{ color:var(--ink); font-weight:700; font-variant-numeric:tabular-nums; }
  .abudget b.over{ color:#D64B4B; }
  .abudget .amax{ color:var(--muted); font-variant-numeric:tabular-nums; }
  .abudget .mini{ flex:1; position:relative; height:7px; border-radius:999px; background:var(--track); }
  .abudget .minifill{ position:absolute; left:0; top:0; bottom:0; border-radius:999px; min-width:3px; }
  .abudget .minitick{ position:absolute; top:-3px; bottom:-3px; width:2px; border-radius:2px; background:var(--ink); opacity:.5; }

  /* ---------- DASHBOARD ---------- */
  .mnav{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin:4px 0 18px; }
  .mnav .mbtn{ width:40px; height:40px; border-radius:14px; background:var(--card); border:1px solid var(--line); font-size:16px; display:flex; align-items:center; justify-content:center; box-shadow:0 1px 2px rgba(27,27,31,.03); }
  .mnav .mbtn:active{ background:var(--keypress); }
  .mnav .mname{ font-family:"Bricolage Grotesque",sans-serif; font-weight:700; font-size:17px; text-align:center; }
  .mnav .mname .yr{ color:var(--muted); font-weight:600; margin-left:6px; font-family:"JetBrains Mono",monospace; font-size:11px; }

  .timeline{ background:var(--card); border:1px solid var(--line); border-radius:var(--r-lg); box-shadow:var(--shadow); padding:16px 16px 13px; margin-bottom:14px; }
  .tlbar{ position:relative; height:8px; border-radius:999px; background:var(--track); margin:6px 4px 14px; }
  .tldot{ position:absolute; top:50%; width:12px; height:12px; margin:-6px 0 0 -6px; border-radius:50%; border:2.5px solid var(--card); box-shadow:0 1px 3px rgba(0,0,0,.18); }
  .tldot.past{ opacity:.4; }
  .tlnow{ position:absolute; top:-6px; bottom:-6px; width:2px; margin-left:-1px; border-radius:2px; background:var(--ink); opacity:.65; }
  .tlnow::after{ content:"today"; position:absolute; top:-15px; left:50%; transform:translateX(-50%); font-family:"JetBrains Mono",monospace; font-size:8.5px; color:var(--muted); }
  .tlchips{ display:flex; flex-wrap:wrap; gap:7px; }
  .tlchip{ display:inline-flex; align-items:center; gap:5px; font-size:11.5px; color:var(--muted); background:var(--track); border-radius:999px; padding:5px 10px; white-space:nowrap; }
  .tlchip b{ color:var(--ink); font-weight:700; }
  .tlchip.past{ opacity:.5; }
  .tlchip .cdot{ width:7px; height:7px; border-radius:50%; }

  .hero{ background:var(--card); border:1px solid var(--line); border-radius:var(--r-lg); box-shadow:var(--shadow); padding:22px 18px 18px; margin-bottom:14px; text-align:center; }
  .donutwrap{ position:relative; width:210px; height:210px; margin:0 auto 8px; }
  .donutwrap svg{ width:100%; height:100%; transform:rotate(-90deg); }
  .seglayer{ position:absolute; inset:0; pointer-events:none; }
  .seglbl{ position:absolute; transform:translate(-50%,-50%); font-family:"Bricolage Grotesque",sans-serif; font-weight:800; font-size:11.5px; color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.32); }
  .donutwrap .center{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; }
  .donutwrap .center .lbl{ font-family:"JetBrains Mono",monospace; font-size:10px; letter-spacing:.14em; color:var(--muted); }
  .donutwrap .center .tot{ font-family:"Bricolage Grotesque",sans-serif; font-weight:800; font-size:30px; letter-spacing:-.03em; font-variant-numeric:tabular-nums; }
  .donutwrap .center .tot .u{ font-size:15px; color:var(--muted); font-weight:700; margin-right:3px; }
  .hero .stats{ display:flex; justify-content:center; gap:18px; font-size:13px; color:var(--muted); }
  .hero .stats b{ color:var(--ink); font-weight:700; }

  .catcells{ display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-top:16px; text-align:left; }
  .cg{ border-radius:14px; padding:10px 12px; }
  .cg .n{ display:flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cg .cdot{ width:8px; height:8px; border-radius:3px; flex:0 0 auto; }
  .cg .v{ font-family:"Bricolage Grotesque",sans-serif; font-weight:800; font-size:16.5px; letter-spacing:-.02em; margin-top:3px; font-variant-numeric:tabular-nums; }
  .cg .v .p{ font-family:"JetBrains Mono",monospace; font-size:10.5px; font-weight:600; color:var(--muted); margin-left:4px; }

  .csplit{ background:var(--card); border:1px solid var(--line); border-radius:var(--r-lg); box-shadow:var(--shadow); padding:14px 16px; margin-bottom:14px; }
  .csplit .ch{ font-family:"JetBrains Mono",monospace; font-size:11px; letter-spacing:.12em; color:var(--muted); margin-bottom:10px; }
  .cbar{ display:flex; height:12px; border-radius:999px; overflow:hidden; background:var(--track); margin-bottom:10px; }
  .cbar span{ height:100%; }
  .cleg{ display:flex; justify-content:space-between; gap:10px; font-size:12.5px; flex-wrap:wrap; }
  .cleg .ci{ display:flex; align-items:center; gap:6px; color:var(--muted); }
  .cleg .ci .cdot{ width:8px; height:8px; border-radius:3px; }
  .cleg b{ color:var(--ink); font-variant-numeric:tabular-nums; }
  .ash{ font-family:"JetBrains Mono",monospace; font-size:10.5px; letter-spacing:.1em; color:var(--muted); border-top:1px solid var(--div); margin-top:12px; padding-top:12px; }
  .asrow{ display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin-top:5px; }
  .asv{ font-family:"Bricolage Grotesque",sans-serif; font-weight:800; font-size:18px; letter-spacing:-.02em; color:#5EA0E6; font-variant-numeric:tabular-nums; }
  .asd{ font-size:12px; color:var(--muted); }
  .ctag{ font-family:"JetBrains Mono",monospace; font-size:9px; font-weight:700; color:#5EA0E6; background:rgba(94,160,230,.14); padding:1px 5px; border-radius:5px; vertical-align:1px; }
  .txh{ font-family:"JetBrains Mono",monospace; font-size:11px; letter-spacing:.12em; color:var(--muted); margin:20px 4px 8px; }
  .dhead{ display:flex; align-items:baseline; justify-content:space-between; padding:10px 4px 6px; }
  .dhead .d{ font-size:12px; font-weight:600; color:var(--muted); }
  .dhead .s{ font-family:"JetBrains Mono",monospace; font-size:11.5px; color:var(--muted); }
  .item{ display:flex; align-items:center; gap:11px; background:var(--card); border:1px solid var(--line); border-radius:var(--r-md); padding:11px 12px; margin-bottom:8px; box-shadow:0 1px 2px rgba(27,27,31,.03); }
  .item .emo{ width:38px; height:38px; flex:0 0 auto; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:17px; }
  .item .mid{ flex:1; min-width:0; }
  .item .t1{ font-size:14px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .item .t2{ font-size:11.5px; color:var(--muted); }
  .item .t2 .tdate{ font-family:"JetBrains Mono",monospace; font-size:10.5px; font-variant-numeric:tabular-nums; }
  .item .amt{ font-family:"Bricolage Grotesque",sans-serif; font-weight:700; font-size:15px; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .item .del{ display:inline-flex; align-items:center; justify-content:center; width:28px; height:28px; border-radius:9px; color:#B98B8B; font-size:13px; flex:0 0 auto; }
  .item .del:active{ background:var(--delbg); color:var(--delink); }

  .empty-state{ text-align:center; padding:44px 22px; border:1.5px dashed var(--line); border-radius:var(--r-lg); background:var(--empty); }
  .empty-state .glyph{ font-size:30px; margin-bottom:8px; }
  .empty-state .big{ font-family:"Bricolage Grotesque",sans-serif; font-weight:700; font-size:17px; margin:0 0 6px; }
  .empty-state p{ color:var(--muted); margin:0; font-size:13px; }

  /* ---------- OVERSIKT ---------- */
  .oprog{ background:var(--card); border:1px solid var(--line); border-radius:var(--r-lg); box-shadow:var(--shadow); padding:16px; margin-bottom:14px; }
  .oprow+.oprow{ margin-top:13px; }
  .oprow .ot{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:7px; }
  .oprow .ol{ font-size:13px; font-weight:700; }
  .oprow .ov{ font-family:"JetBrains Mono",monospace; font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .oprow .obar{ height:9px; border-radius:999px; background:var(--track); overflow:hidden; }
  .oprow .ofill{ height:100%; border-radius:999px; background:var(--mint); min-width:3px; transition:width .18s ease; }

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

const SUPABASE_URL = window.SUPABASE_URL || "";
const SUPABASE_ANON_KEY = window.SUPABASE_ANON_KEY || "";

/* ---------------- Categories ---------------- */

];

/* Amex statement cycle: starts on the 24th, closes on the 23rd of the next month.
   (Amex posts a 24th purchase into the period labelled "25 aug – …", so the real
   cut-off sits one day earlier than the label suggests.) */
const AMEX_CYCLE_DAY = 24;

/* Payment method on every expense */

  { key:"amex",    emoji:"💳", name:"Amex",    color:"#5EA0E6" },
  { key:"regular", emoji:"💵", name:"Regular", color:"#8A8694" },
];

/* Food budget: Groceries + Dining, 8 000 kr/month */

/* ----- Oversikt: Isaac & Nga monthly plan (from I&N oversikt sheet) ----- */

                   {key:"short", label:"✈️ Short term", hint:"Poker/Beauty · Reise Asia"} ];

const PLAN={
  income:{ I:40000, N:33000 },
  fixed:[
    { id:"leie",     name:"Leie",           I:13000, N:7000 },

    { id:"transport",name:"Transport",      I:500,   N:500 },

};

/* ---------------- Helpers ---------------- */
const $ = id => document.getElementById(id);
const esc = s => { const d=document.createElement("div"); d.textContent=s==null?"":s; return d.innerHTML; };
const pad2 = n => String(n).padStart(2,"0");
const ymd = d => d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());
const todayStr = () => ymd(new Date());
const daysInMonth = (y,m) => new Date(y,m+1,0).getDate();
const fmtKr = n => new Intl.NumberFormat("nb-NO",{maximumFractionDigits:(n%1?2:0)}).format(n);
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
function dayLabel(iso){
  const t=todayStr(), y=ymd(new Date(Date.now()-86400000));
  const d=new Date(iso+"T12:00:00");
  const full=d.toLocaleDateString("en-GB",{day:"numeric",month:"short"}).toUpperCase();
  if(iso===t) return "TODAY · "+full;
  if(iso===y) return "YESTERDAY · "+full;
  return d.toLocaleDateString("en-GB",{weekday:"short"}).toUpperCase()+" · "+full;

let expenses = [];   // all rows, mapped {id, amount:Number, cat, card, note, spent_on, created_at}
let checks = {};     // "YYYY-MM:item:person" -> true
const now = new Date();
const today0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
let cycOffset = 0;                                   // Dashboard: 0 = current Amex cycle
let ovY = now.getFullYear(), ovM = now.getMonth();   // Oversikt: calendar month

/* ---------------- Amex cycle helpers ---------------- */
function cycleFor(offset){
  let s = today0.getDate() >= AMEX_CYCLE_DAY
    ? new Date(today0.getFullYear(), today0.getMonth(), AMEX_CYCLE_DAY)
    : new Date(today0.getFullYear(), today0.getMonth()-1, AMEX_CYCLE_DAY);
  s = new Date(s.getFullYear(), s.getMonth()+offset, AMEX_CYCLE_DAY);
  const e = new Date(s.getFullYear(), s.getMonth()+1, AMEX_CYCLE_DAY-1);
  return { s, e, sIso:ymd(s), eIso:ymd(e),
           isCur: offset===0,
           days: Math.round((e-s)/86400000)+1 };
}
function cycleExpenses(c){
  return expenses.filter(e=>e.spent_on>=c.sIso&&e.spent_on<=c.eIso)
    .sort((a,b)=>b.spent_on.localeCompare(a.spent_on)||String(b.created_at).localeCompare(String(a.created_at)));
}
function foodInCycle(c){
  return expenses.filter(e=>e.spent_on>=c.sIso&&e.spent_on<=c.eIso&&BUDGET.cats.includes(e.cat))
    .reduce((s,e)=>s+e.amount,0);
}
/* how far we are through the cycle: 0..1, null if not the running cycle */
function cyclePace(c){
  if(today0 < c.s || today0 > c.e) return null;
  return (Math.round((today0-c.s)/86400000)+1)/c.days;
}
function daysLeft(c){ return Math.round((c.e-today0)/86400000); }
const fmtD = d => d.toLocaleDateString("en-GB",{day:"numeric",month:"short"});

/* ---------------- Sync UI ---------------- */
function setSync(state){
  const el=$("syncState");
  if(state==="ok") el.innerHTML='<span class="synced">● Synced</span>';
  else if(state==="err") el.textContent="Connection error";
  else if(state==="none") el.textContent="Not configured";
  else el.textContent="Connecting…";
}
function showNotice(msg){
  const n=$("notice"); n.style.display="block";
  n.innerHTML=msg||'<b>Supabase not configured.</b> Copy config.example.js to config.js, paste your project URL + anon key, and upload it.';
}

/* ---------------- Data layer ---------------- */
async function reloadAll(){
  if(!configured){ setSync("none"); showNotice(); renderDash(); renderOversikt(); return; }
  try{
    const [a,b]=await Promise.all([
      sb.from("expenses").select("*").order("spent_on",{ascending:false}).order("created_at",{ascending:false}),
      sb.from("oversikt_checks").select("month,item,person,amount"),
    ]);
    if(a.error) throw a.error;
    if(b.error) throw b.error;
    expenses=(a.data||[]).map(e=>({ id:e.id, amount:Number(e.amount), cat:e.category, card:e.card||"regular", note:e.note||"", spent_on:e.spent_on, created_at:e.created_at }));
    checks={};
    (b.data||[]).forEach(r=>{
      const planned=plannedAmount(r.item,r.person);
      checks[r.month+":"+r.item+":"+r.person] = (r.amount==null?planned:Number(r.amount));
    });
    setSync("ok");
    renderDash(); renderOversikt();
  }catch(e){
    console.error(e); setSync("err");
    showNotice("Could not load data. Check config.js and that the <b>expenses</b> and <b>oversikt_checks</b> tables exist (see README-SETUP).");
  }
}
async function dbAddExpense(row){

  return data;
}
async function dbRemoveExpense(id){

  if(error) console.error(error);
}

/* which Amex cycle does a date belong to (offset from the current one) */
function cycleOffsetFor(iso){
  for(let o=-36;o<=36;o++){ const c=cycleFor(o); if(iso>=c.sIso&&iso<=c.eIso) return o; }
  return 0;
}

function press(k){

const stColors={ok:"var(--mint)",warn:"#E8A13C",over:"#E15B5B"};
function renderBudget(c){
  const spent=foodInCycle(c);
  const pace=cyclePace(c);
  const st=spent>BUDGET.amount ? "over" : (pace!=null && spent>BUDGET.amount*pace ? "warn" : "ok");
  const pct=Math.min(100,spent/BUDGET.amount*100);
  const left=BUDGET.amount-spent;
  let big;
  if(pace!=null){
    big = st==="over" ? 'kr '+fmtKr(spent-BUDGET.amount)+' over' : 'kr '+fmtKr(left)+' left';
  } else if(today0 < c.s){
    big='kr '+fmtKr(BUDGET.amount)+' left';
  } else {
    big = left>=0 ? 'kr '+fmtKr(left)+' under' : 'kr '+fmtKr(-left)+' over';
  }
  const tick = pace!=null ? '<span class="btick" style="left:'+(pace*100).toFixed(1)+'%"></span>' : '';

    '<div class="b-top"><span class="b-name">'+BUDGET.emoji+' '+BUDGET.label+'</span><span class="b-cap">kr '+fmtKr(spent)+' / '+fmtKr(BUDGET.amount)+'</span></div>'+
    '<div class="b-left '+st+'">'+big+'</div>'+
    '<div class="bbar"><span class="bfill '+st+'" style="width:'+pct.toFixed(1)+'%"></span>'+tick+'</div>';

function renderAddBudget(){

    '<span class="atxt">'+BUDGET.emoji+' Food: <b'+(st==="over"?' class="over"':'')+'>kr '+fmtKr(spent)+'</b><span class="amax"> / '+fmtKr(BUDGET.amount)+'</span></span>'+

function renderDonut(byCat,total){
  const svg=$("donut"), lbls=$("segLbls");
  const R=84, C=2*Math.PI*R, W=26;
  if(total<=0){ svg.innerHTML='<circle cx="100" cy="100" r="'+R+'" fill="none" style="stroke:var(--track)" stroke-width="'+W+'"/>'; lbls.innerHTML=""; return; }
  let off=0, parts='', labels='';
  const gap = byCat.length>1 ? 0.012*C : 0;
  byCat.forEach(([key,v])=>{
    const frac=v/total, len=Math.max(0, frac*C-gap);
    parts+='<circle cx="100" cy="100" r="'+R+'" fill="none" stroke="'+catOf(key).color+'" stroke-width="'+W+'" stroke-linecap="round" stroke-dasharray="'+len+' '+(C-len)+'" stroke-dashoffset="'+(-off)+'"/>';
    if(frac>=0.07){
      const midFrac=off/C+frac/2;
      const th=(-90+360*midFrac)*Math.PI/180;
      const x=(100+R*Math.cos(th))/200*100, y=(100+R*Math.sin(th))/200*100;
      labels+='<span class="seglbl" style="left:'+x.toFixed(1)+'%;top:'+y.toFixed(1)+'%">'+Math.round(frac*100)+'%</span>';
    }
    off+=frac*C;
  });
  svg.innerHTML='<circle cx="100" cy="100" r="'+R+'" fill="none" style="stroke:var(--track)" stroke-width="'+W+'"/>'+parts;
  lbls.innerHTML=labels;
}

function cycleEvents(c){
  const out=[];
  PAYDAYS.forEach(p=>{
    for(let k=0;k<=1;k++){
      const d=new Date(c.s.getFullYear(), c.s.getMonth()+k, p.day);
      if(d>=c.s&&d<=c.e) out.push({ d, emoji:"💰", label:p.name, color:p.color, kind:"pay" });
    }
  });
  out.push({ d:c.e, emoji:"💳", label:"Amex closes", color:"#5EA0E6", kind:"close" });
  return out.sort((a,b)=>a.d-b.d);
}
function renderTimeline(c){
  const el=$("timeline");
  const evs=cycleEvents(c);
  const span=Math.max(1,c.e-c.s);
  const pace=cyclePace(c);
  const pos=d=>((d-c.s)/span*100);
  const dots=evs.map(ev=>{
    const past=ev.d<today0;
    return '<span class="tldot'+(past?" past":"")+'" style="left:'+pos(ev.d).toFixed(1)+'%;background:'+ev.color+'"></span>';
  }).join("");
  const nowMark = pace!=null ? '<span class="tlnow" style="left:'+(pace*100).toFixed(1)+'%"></span>' : '';
  const chips=evs.map(ev=>{
    const dd=Math.round((ev.d-today0)/86400000);
    let when;
    if(dd<0) when = ev.kind==="pay" ? "paid" : "closed";
    else if(dd===0) when = "today";
    else when = "in "+dd+"d";
    return '<span class="tlchip'+(dd<0?" past":"")+'">'+
      '<span class="cdot" style="background:'+ev.color+'"></span>'+ev.emoji+' '+esc(ev.label)+
      ' <b>'+fmtD(ev.d)+'</b> · '+when+'</span>';
  }).join("");
  el.innerHTML='<div class="tlbar">'+dots+nowMark+'</div><div class="tlchips">'+chips+'</div>';
}

function renderDash(){
  const c=cycleFor(cycOffset);
  renderBudget(c); renderAddBudget(); renderAmt(); renderTimeline(c);
  const list=cycleExpenses(c);
  const total=list.reduce((s,e)=>s+e.amount,0);
  const pace=cyclePace(c);
  let tag;
  if(pace!=null){ const d=daysLeft(c); tag = d===0 ? 'closes today' : 'closes in '+d+' day'+(d===1?'':'s'); }
  else tag = today0 > c.e ? 'closed' : 'upcoming';
  $("mName").innerHTML=fmtD(c.s)+' – '+fmtD(c.e)+'<span class="yr">'+tag+'</span>';
  $("mTotal").textContent=fmtKr(total);
  const elapsed=pace!=null ? Math.round(pace*c.days) : c.days;
  $("mStats").innerHTML='<span><b>'+list.length+'</b> txns</span><span><b>'+fmtKr(Math.round(total/Math.max(1,elapsed)))+'</b> kr/day</span>';

  const by={};
  list.forEach(e=>{ by[e.cat]=(by[e.cat]||0)+e.amount; });
  const byCat=Object.entries(by).sort((a,b)=>b[1]-a[1]);
  renderDonut(byCat,total);
  renderCardSplit(list,total);

  $("catCells").innerHTML=byCat.map(([key,v])=>{
    const c=catOf(key), pct=total>0?Math.round(v/total*100):0;
    return '<div class="cg" style="background:'+c.color+'1F">'+
      '<div class="n"><span class="cdot" style="background:'+c.color+'"></span>'+c.emoji+' '+esc(c.name)+'</div>'+
      '<div class="v">kr '+fmtKr(v)+'<span class="p">'+pct+'%</span></div>'+
      '</div>';
  }).join("");

  const tx=$("txList");
  if(!configured){ tx.innerHTML='<div class="empty-state"><div class="glyph">🔌</div><p class="big">Supabase not configured</p><p>See the yellow banner on top.</p></div>'; return; }
  if(!list.length){ tx.innerHTML='<div class="empty-state"><div class="glyph">🧾</div><p class="big">Nothing this cycle</p><p>Add your first expense from the Add tab.</p></div>'; return; }
  const groups={};
  list.forEach(e=>{ (groups[e.spent_on]=groups[e.spent_on]||[]).push(e); });
  tx.innerHTML=Object.keys(groups).sort().reverse().map(iso=>{
    const items=groups[iso];
    const daySum=items.reduce((s,e)=>s+e.amount,0);
    return '<div class="dhead"><span class="d">'+dayLabel(iso)+'</span><span class="s">KR '+fmtKr(daySum)+'</span></div>'+
      items.map(e=>{
        const c=catOf(e.cat);
        const dt=new Date(e.spent_on+"T12:00:00").toLocaleDateString("en-GB",{day:"2-digit",month:"short"});
        const time=e.spent_on===todayStr()?' '+new Date(e.created_at).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}):'';
        return '<div class="item"><span class="emo" style="background:'+c.color+'26">'+c.emoji+'</span>'+
          '<span class="mid"><span class="t1">'+esc(e.note||c.name)+'</span><span class="t2"><span class="tdate">'+dt+time+'</span>'+(e.note?' · '+esc(c.name):'')+(e.card==="amex"?' · <span class="ctag">AMEX</span>':'')+'</span></span>'+
          '<span class="amt">kr '+fmtKr(e.amount)+'</span>'+
          '<button class="del" data-del="'+e.id+'" title="Delete">✕</button></div>';
      }).join("");
  }).join("");
  tx.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{
    const id=b.getAttribute("data-del");
    expenses=expenses.filter(x=>String(x.id)!==id);
    renderDash();
    await dbRemoveExpense(id);
  });
}

/* ---------------- OVERSIKT page ---------------- */
function mKey(){ return ovY+"-"+pad2(ovM+1); }
function planItem(id){ return PLAN.fixed.find(i=>i.id===id) || PLAN.savings.find(i=>i.id===id); }
function plannedAmount(id,p){ const it=planItem(id); return it ? (it[p]||0) : 0; }
/* actual amount put in for a month; 0 when nothing was ticked */
function amountOf(month,id,p){ const v=checks[month+":"+id+":"+p]; return v==null?0:v; }
function isPartial(month,id,p){ const v=checks[month+":"+id+":"+p]; return v!=null && v!==plannedAmount(id,p); }
function isChecked(id,p){ return checks[mKey()+":"+id+":"+p]!=null; }
async function toggleCheck(id,p){
  const on = checks[mKey()+":"+id+":"+p]==null;
  await setCheckAmount(id, p, on ? plannedAmount(id,p) : null);
}
async function setCheckAmount(id,p,amount){
  if(!configured) return;
  const month=mKey(), key=month+":"+id+":"+p;
  const prev=checks[key];
  if(amount==null||amount<=0) delete checks[key]; else checks[key]=amount;
  renderOversikt();
  if($("pageSave").classList.contains("on")) renderSaving();
  try{
    if(amount==null||amount<=0){
      const { error }=await sb.from("oversikt_checks").delete().match({ month, item:id, person:p });
      if(error) throw error;
    } else {
      const { error }=await sb.from("oversikt_checks").upsert({ month, item:id, person:p, amount },{ onConflict:"month,item,person" });
      if(error) throw error;
    }
  }catch(e){
    console.error(e);
    if(prev==null) delete checks[key]; else checks[key]=prev;
    renderOversikt();
  }
}
function chipHtml(it,p){
  const plan=it[p.k]||0; if(!plan) return "";
  const on=isChecked(it.id,p.k);
  const act=on?amountOf(mKey(),it.id,p.k):plan;
  const part=on&&isPartial(mKey(),it.id,p.k);
  const style=on?'background:'+p.color+';border-color:'+p.color+';':'';
  return '<button class="pchip'+(on?" on":"")+(part?" part":"")+'" style="'+style+'" data-ck="'+it.id+':'+p.k+'">'+
    '<span class="pi" style="background:'+(on?'rgba(255,255,255,.28)':p.color)+'">'+p.k+'</span>'+
    fmtKr(act)+(on?(part?'<span class="pof">/'+fmtKr(plan)+'</span> ✓':' ✓'):'')+'</button>';
}

function renderOversikt(){
  const isCur=(ovY===now.getFullYear()&&ovM===now.getMonth());
  $("mName2").innerHTML=esc(MONTHS[ovM])+(isCur?' · this month':'')+'<span class="yr">'+ovY+'</span>';

  let fixPlan=0,fixDone=0,savPlan=0,savDone=0;
  PLAN.fixed.forEach(it=>{ if(it.auto)return; PEOPLE.forEach(p=>{ const a=it[p.k]||0; if(!a)return; fixPlan+=a; fixDone+=amountOf(mKey(),it.id,p.k); }); });
  PLAN.savings.forEach(it=>{ PEOPLE.forEach(p=>{ const a=it[p.k]||0; if(!a)return; savPlan+=a; savDone+=amountOf(mKey(),it.id,p.k); }); });
  const allDone=fixPlan>0&&savPlan>0&&fixDone===fixPlan&&savDone===savPlan;
  $("ovProg").innerHTML=
    '<div class="oprow"><div class="ot"><span class="ol">🧾 Bills & fixed paid</span><span class="ov">kr '+fmtKr(fixDone)+' / '+fmtKr(fixPlan)+'</span></div><div class="obar"><div class="ofill" style="width:'+(fixPlan?fixDone/fixPlan*100:0).toFixed(1)+'%"></div></div></div>'+
    '<div class="oprow"><div class="ot"><span class="ol">🏦 Savings transferred</span><span class="ov">kr '+fmtKr(savDone)+' / '+fmtKr(savPlan)+'</span></div><div class="obar"><div class="ofill" style="width:'+(savPlan?savDone/savPlan*100:0).toFixed(1)+'%"></div></div></div>'+
    (allDone?'<div class="odone">Everything checked for '+MONTHS[ovM]+' ✓ Bills paid & savings on target</div>':'');

  $("ovFree").innerHTML='<div class="oh" style="padding-left:2px">SALARY IN → WHAT\'S LEFT</div>'+PAYDAYS.map(p=>{
    const income=PLAN.income[p.k]||0;
    const food=PLAN.fixed.filter(it=>it.auto).reduce((s,it)=>s+(it[p.k]||0),0);
    const bills=PLAN.fixed.filter(it=>!it.auto).reduce((s,it)=>s+(it[p.k]||0),0);
    const savPlan=PLAN.savings.reduce((s,it)=>s+(it[p.k]||0),0);
    let savDone=0;
    PLAN.savings.forEach(it=>{ if(it[p.k]) savDone+=amountOf(mKey(),it.id,p.k); });
    const left=income-bills-food-savPlan;
    /* payday status for the month being viewed */
    const pd=new Date(ovY, ovM, p.day);
    const dd=Math.round((pd-today0)/86400000);
    const paid = dd<0 || (dd===0);
    const when = dd<0 ? "paid" : (dd===0 ? "today" : "in "+dd+"d");
    return '<div class="flowcard">'+
      '<div class="fhead"><span class="pi" style="background:'+p.color+'">'+p.k+'</span>'+
        '<span class="fname">'+p.name+'</span>'+
        '<span class="fpay'+(paid?" on":"")+'">💰 '+p.day+'. · '+when+'</span></div>'+
      '<div class="frow in"><span>Salary in</span><b>kr '+fmtKr(income)+'</b></div>'+
      '<div class="frow"><span>− Bills & fixed</span><b>kr '+fmtKr(bills)+'</b></div>'+
      '<div class="frow"><span>− Food share</span><b>kr '+fmtKr(food)+'</b></div>'+
      '<div class="frow"><span>− Savings</span><b>kr '+fmtKr(savPlan)+'</b></div>'+
      '<div class="frow tot"><span>Left over</span><b>kr '+fmtKr(left)+'</b></div>'+
      '<div class="fmini"><span class="fbar"><span class="ffill" style="width:'+(savPlan?savDone/savPlan*100:0).toFixed(1)+'%;background:'+p.color+'"></span></span>'+
        '<span class="fnote">Savings moved: <b>kr '+fmtKr(savDone)+'</b> / '+fmtKr(savPlan)+'</span></div>'+
      '</div>';
  }).join("")+
  (function(){
    const inc=PEOPLE.reduce((s,p)=>s+(PLAN.income[p.k]||0),0);
    const bills=PLAN.fixed.filter(it=>!it.auto).reduce((s,it)=>s+(it.I||0)+(it.N||0),0);
    const food=PLAN.fixed.filter(it=>it.auto).reduce((s,it)=>s+(it.I||0)+(it.N||0),0);
    const sav=PLAN.savings.reduce((s,it)=>s+(it.I||0)+(it.N||0),0);
    return '<div class="flowtot"><span>Together</span><b>kr '+fmtKr(inc-bills-food-sav)+'</b><span class="fl">left over after bills, kr '+fmtKr(food)+' food & kr '+fmtKr(sav)+' savings</span></div>';
  })();

  const cyc=cycleFor(0);
  const spent=foodInCycle(cyc);
  const matIt=PLAN.fixed.find(i=>i.id==="mat");
  const matPlan=(matIt.I||0)+(matIt.N||0);
  const pacePct=cyclePace(cyc);
  const matSt=spent>matPlan ? "over" : (pacePct!=null&&spent>matPlan*pacePct ? "warn" : "ok");
  $("ovFixed").innerHTML='<div class="oh">FIXED COSTS</div>'+PLAN.fixed.map(it=>{
    const info='<span class="oinfo"><span class="oname">'+esc(it.name)+'</span>'+(it.note?'<div class="onote">'+esc(it.note)+'</div>':'')+'</span>';
    if(it.auto){
      const tick=pacePct!=null?'<span class="mtick" style="left:'+(pacePct*100).toFixed(1)+'%"></span>':'';
      return '<div class="orow">'+info+'<span class="matbar"><span class="mb"><span class="mf" style="width:'+Math.min(100,spent/matPlan*100).toFixed(1)+'%;background:'+stColors[matSt]+'"></span>'+tick+'</span><span class="mv">kr '+fmtKr(spent)+' / '+fmtKr(matPlan)+'</span></span></div>';
    }
    return '<div class="orow">'+info+PEOPLE.map(p=>chipHtml(it,p)).join("")+'</div>';
  }).join("");

  $("ovSave").innerHTML='<div class="oh">SAVINGS</div>'+PLAN.savings.map(it=>{
    return '<div class="orow"><span class="oinfo"><span class="oname">'+esc(it.name)+'</span></span>'+PEOPLE.map(p=>chipHtml(it,p)).join("")+'</div>';
  }).join("");

  document.querySelectorAll("[data-ck]").forEach(b=>{
    const parts=b.getAttribute("data-ck").split(":"), id=parts[0], p=parts[1];
    let timer=null, held=false;
    const start=()=>{ held=false; timer=setTimeout(()=>{ held=true; if(navigator.vibrate)navigator.vibrate(12); openEdit(id,p); },420); };
    const stop=()=>{ clearTimeout(timer); };
    b.addEventListener("touchstart",start,{passive:true});
    b.addEventListener("touchend",stop);
    b.addEventListener("touchmove",stop,{passive:true});
    b.addEventListener("mousedown",start);
    b.addEventListener("mouseup",stop);
    b.addEventListener("mouseleave",stop);
    b.addEventListener("contextmenu",e=>e.preventDefault());
    b.onclick=()=>{ if(held){ held=false; return; } toggleCheck(id,p); };
  });
  if($("pageSave").classList.contains("on")) renderSaving();
}
$("prevM2").onclick=()=>{ ovM--; if(ovM<0){ovM=11;ovY--;} renderOversikt(); };
$("nextM2").onclick=()=>{ ovM++; if(ovM>11){ovM=0;ovY++;} renderOversikt(); };

/* ---------------- SAVING DASHBOARD page ---------------- */
const savPlanTotal = () => PLAN.savings.reduce((s,it)=>s+(it.I||0)+(it.N||0),0);
function savDoneIn(monthKey){
  let done=0;
  PLAN.savings.forEach(it=>PEOPLE.forEach(p=>{ if(it[p.k]) done+=amountOf(monthKey,it.id,p.k); }));
  return done;
}
let savOffset=0;   // 0 = current month in the Saving Dashboard detail card
function savKey(off){ const d=new Date(now.getFullYear(), now.getMonth()+off, 1); return d.getFullYear()+"-"+pad2(d.getMonth()+1); }
function savMonths(){
  const set=new Set();
  Object.keys(checks).forEach(k=>set.add(k.split(":")[0]));
  set.add(now.getFullYear()+"-"+pad2(now.getMonth()+1));
  return [...set].sort().reverse().slice(0,12);
}
function renderSaving(){
  const plan=savPlanTotal();
  const months=savMonths();
  const rows=months.map(m=>({ m, done:savDoneIn(m) }));
  const total=rows.reduce((s,r)=>s+r.done,0);
  const full=rows.filter(r=>r.done>=plan).length;
  const started=rows.filter(r=>r.done>0).length;
  let streak=0;
  for(const r of rows){ if(r.done>=plan) streak++; else if(streak>0||r.done<plan) break; }

  $("savHero").innerHTML=
    '<div class="sv-lbl">TOTAL SAVED · TRACKED IN APP</div>'+
    '<div class="sv-big">kr '+fmtKr(total)+'</div>'+
    '<div class="sv-sub"><span><b>'+full+'</b> of '+started+' month'+(started===1?'':'s')+' fully on plan</span>'+
    (streak>1?'<span>🔥 <b>'+streak+'</b> in a row</span>':'')+'</div>';

  $("savGoals").innerHTML=SAV_GROUPS.map(g=>{
    const items=PLAN.savings.filter(it=>it.group===g.key);
    if(!items.length) return "";
    let gAcc=0;
    const cells=items.map(it=>{
      let acc=0;
      months.forEach(m=>PEOPLE.forEach(p=>{ if(it[p.k]) acc+=amountOf(m,it.id,p.k); }));
      gAcc+=acc;
      const per=(it.I||0)+(it.N||0);
      return '<div class="cg" style="background:var(--track)">'+
        '<div class="n">'+esc(it.name)+'</div>'+
        '<div class="v">kr '+fmtKr(acc)+'<span class="p">'+fmtKr(per)+'/mo</span></div>'+
        '</div>';
    }).join("");
    return '<div class="ghead"><span class="gl">'+g.label+'</span><span class="gt">kr '+fmtKr(gAcc)+'</span></div>'+
           '<div class="gcells">'+cells+'</div>';
  }).join("");

  renderSavMonth();

  const curKey=savKey(0);
  const selKey=savKey(savOffset);
  $("savHist").innerHTML='<div class="oh">ALL MONTHS · PLAN kr '+fmtKr(plan)+'</div>'+rows.map(r=>{
    const parts=r.m.split("-");
    const pct=Math.min(100,r.done/plan*100);
    const isCur=r.m===curKey;
    let badge,cls;
    if(r.done>=plan){ badge='✓ on plan'; cls='ok'; }
    else if(r.done===0){ badge=isCur?'not started':'missed'; cls=isCur?'cur':'miss'; }
    else { badge=Math.round(pct)+'%'; cls=isCur?'cur':'part'; }
    return '<div class="svrow'+(r.m===selKey?' sel':'')+'" data-mo="'+r.m+'">'+
      '<span class="svm">'+esc(MONTHS[parseInt(parts[1],10)-1].slice(0,3))+' <span class="svy">'+parts[0]+'</span></span>'+
      '<span class="svbar"><span class="svfill '+cls+'" style="width:'+Math.max(2,pct).toFixed(1)+'%"></span></span>'+
      '<span class="svamt">'+fmtKr(r.done)+'</span>'+
      '<span class="svb '+cls+'">'+badge+'</span>'+
      '</div>';
  }).join("");
  $("savHist").querySelectorAll("[data-mo]").forEach(el=>el.onclick=()=>{
    const mo=el.getAttribute("data-mo"), parts=mo.split("-");
    savOffset=(parseInt(parts[0],10)-now.getFullYear())*12+(parseInt(parts[1],10)-1-now.getMonth());
    renderSaving();
    $("savMonth").scrollIntoView({behavior:"smooth",block:"center"});
  });
}

/* ---- one month, goal by goal (swipe left/right to change month) ---- */
function renderSavMonth(){
  const key=savKey(savOffset);
  const parts=key.split("-");
  const mi=parseInt(parts[1],10)-1;
  const plan=savPlanTotal();
  const done=savDoneIn(key);
  const pct=Math.min(100,done/plan*100);
  const isCur=savOffset===0;
  const cls = done>=plan ? "ok" : (done===0 ? (isCur?"cur":"miss") : (isCur?"cur":"part"));

  const goalRow=it=>{
    const gPlan=(it.I||0)+(it.N||0);
    const gDone=PEOPLE.reduce((s,p)=>s+(it[p.k]?amountOf(key,it.id,p.k):0),0);
    const gPct=gPlan?Math.min(100,gDone/gPlan*100):0;
    const who=PEOPLE.filter(p=>it[p.k]).map(p=>{
      const a=amountOf(key,it.id,p.k), pl=it[p.k];
      const st = a===0 ? "none" : (a<pl ? "part" : "full");
      return '<span class="gw '+st+'"><span class="cdot" style="background:'+p.color+'"></span>'+p.k+' '+
        (a===0?'—':fmtKr(a)+(a<pl?'<span class="gof">/'+fmtKr(pl)+'</span>':''))+'</span>';
    }).join("");
    const gcls = gDone>=gPlan ? "ok" : (gDone===0 ? "miss" : "part");
    return '<div class="grow">'+
      '<div class="gtop"><span class="gname">'+esc(it.name)+'</span><span class="gamt"><b>'+fmtKr(gDone)+'</b> / '+fmtKr(gPlan)+'</span></div>'+
      '<div class="gbar"><span class="gfill '+gcls+'" style="width:'+Math.max(2,gPct).toFixed(1)+'%"></span></div>'+
      '<div class="gwho">'+who+'</div>'+
      '</div>';
  };
  const goals=SAV_GROUPS.map(g=>{
    const items=PLAN.savings.filter(it=>it.group===g.key);
    if(!items.length) return "";
    const gPlan=items.reduce((s,it)=>s+(it.I||0)+(it.N||0),0);
    const gDone=items.reduce((s,it)=>s+PEOPLE.reduce((a,p)=>a+(it[p.k]?amountOf(key,it.id,p.k):0),0),0);
    return '<div class="ghead in"><span class="gl">'+g.label+'</span><span class="gt'+(gDone>=gPlan?' ok':'')+'">'+fmtKr(gDone)+' / '+fmtKr(gPlan)+'</span></div>'+
           items.map(goalRow).join("");
  }).join("");

  $("savMonth").innerHTML=
    '<div class="smhead"><button class="mbtn" id="savPrev" aria-label="Previous month">‹</button>'+
      '<span class="smname">'+esc(MONTHS[mi])+' <span class="smy">'+parts[0]+'</span></span>'+
      '<button class="mbtn" id="savNext" aria-label="Next month">›</button></div>'+
    '<div class="smtot"><span class="smv">kr '+fmtKr(done)+'</span><span class="smp">of kr '+fmtKr(plan)+' planned</span>'+
      '<span class="svb '+cls+'">'+(done>=plan?'✓ on plan':(done===0?(isCur?'not started':'missed'):Math.round(pct)+'%'))+'</span></div>'+
    '<div class="smbar"><span class="smfill '+cls+'" style="width:'+Math.max(1,pct).toFixed(1)+'%"></span></div>'+
    '<div class="goals">'+goals+'</div>'+
    '<div class="smhint">Swipe left / right to change month</div>';

  $("savPrev").onclick=()=>{ savOffset--; renderSaving(); };
  $("savNext").onclick=()=>{ if(savOffset<0){ savOffset++; renderSaving(); } };
  if(savOffset>=0) $("savNext").disabled=true;
}
/* ---------------- Nav ---------------- */
function go(page){
  curTab=page;
  [["pageAdd","navAdd","add"],["pageDash","navDash","dash"],["pageOver","navOver","over"],["pageSave","navSave","save"]]
    .forEach(([pg,nv,key])=>{ $(pg).classList.toggle("on",page===key); $(nv).classList.toggle("on",page===key); });
  if(page==="save") renderSaving();
  $("scroller").scrollTo({top:0});
}
$("navAdd").onclick=()=>go("add");
$("navDash").onclick=()=>go("dash");
$("navOver").onclick=()=>go("over");
$("navSave").onclick=()=>go("save");

/* swipe between tabs */
const TABS=["add","dash","over","save"];
let curTab="add";
(function(){
  const el=$("scroller"); let x0=null,y0=null,ok=false;
  el.addEventListener("touchstart",e=>{
    if(e.touches.length!==1||e.target.closest("#savMonth,input,.pad")){ ok=false; return; }
    ok=true; x0=e.touches[0].clientX; y0=e.touches[0].clientY;
  },{passive:true});
  el.addEventListener("touchend",e=>{
    if(!ok||x0==null) return;
    const t=e.changedTouches[0], dx=t.clientX-x0, dy=t.clientY-y0;
    x0=null;
    if(Math.abs(dx)<65||Math.abs(dx)<Math.abs(dy)*1.6) return;
    const i=TABS.indexOf(curTab);
    const n=dx<0 ? i+1 : i-1;
    if(n>=0&&n<TABS.length) go(TABS[n]);
  },{passive:true});
})();

/* swipe the month card */
(function(){
  const el=$("savMonth"); let x0=null,y0=null;
  el.addEventListener("touchstart",e=>{ const t=e.touches[0]; x0=t.clientX; y0=t.clientY; },{passive:true});
  el.addEventListener("touchend",e=>{
    if(x0==null) return;
    const t=e.changedTouches[0], dx=t.clientX-x0, dy=t.clientY-y0;
    x0=null;
    if(Math.abs(dx)<48||Math.abs(dx)<Math.abs(dy)*1.4) return;
    if(dx>0){ savOffset--; renderSaving(); }
    else if(savOffset<0){ savOffset++; renderSaving(); }
  },{passive:true});
})();

/* ---------------- Theme ---------------- */
const rootEl=document.documentElement;
function setTheme(t){
  rootEl.setAttribute("data-theme",t);
  $("themeBtn").textContent = t==="dark" ? "☀️" : "🌙";
  try{ localStorage.setItem("smeep-theme",t); }catch(e){}
}
let savedTheme=null;
try{ savedTheme=localStorage.getItem("smeep-theme"); }catch(e){}
setTheme(savedTheme || (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
$("themeBtn").onclick=()=>setTheme(rootEl.getAttribute("data-theme")==="dark" ? "light" : "dark");

/* ---------------- Realtime + SW ---------------- */
function subscribe(){
  if(!configured) return;
  let t=null;
  const kick=()=>{ clearTimeout(t); t=setTimeout(reloadAll,300); };
  sb.channel("smeep-changes")
    .on("postgres_changes",{event:"*",schema:"public",table:"expenses"},kick)
    .on("postgres_changes",{event:"*",schema:"public",table:"oversikt_checks"},kick)
    .subscribe();
}
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("./sw.js").then(reg=>{
    reg.update();
    let reloaded=false;
    navigator.serviceWorker.addEventListener("controllerchange",()=>{ if(reloaded)return; reloaded=true; location.reload(); });
  }).catch(()=>{});
}

/* ---------------- Auth ---------------- */
const authOv=$("authOv"), authEmail=$("authEmail"), authPass=$("authPass"), authBtn=$("authBtn"), authErr=$("authErr"), signOutBtn=$("signOutBtn");
let subscribed=false;
function showAuth(){ authOv.classList.add("show"); signOutBtn.style.display="none"; }
function hideAuth(){ authOv.classList.remove("show"); }
function onSignedIn(){
  hideAuth(); signOutBtn.style.display="";
  reloadAll();
  if(!subscribed){ subscribe(); subscribed=true; }
}
authBtn.onclick=async()=>{
  const email=authEmail.value.trim(), password=authPass.value;
  if(!email||!password||!configured) return;
  authBtn.disabled=true; authBtn.textContent="Signing in…"; authErr.textContent="";
  const { error }=await sb.auth.signInWithPassword({ email, password });
  authBtn.disabled=false; authBtn.textContent="Sign in";
  if(error) authErr.textContent="Wrong email or password. Try again.";
};
authPass.addEventListener("keydown",e=>{ if(e.key==="Enter")authBtn.click(); });
authEmail.addEventListener("keydown",e=>{ if(e.key==="Enter")authPass.focus(); });
signOutBtn.onclick=async()=>{ await sb.auth.signOut(); expenses=[]; checks={}; renderDash(); renderOversikt(); showAuth(); };

/* ---------------- Init ---------------- */
$("hDate").textContent=new Date().toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"});
renderPad(); renderCatGrid(); renderCardRow(); renderDateChip(); renderAmt(); renderDash(); renderOversikt();
(async function(){
  if(!configured){ hideAuth(); setSync("none"); showNotice(); return; }
  const { data:{ session } }=await sb.auth.getSession();
  if(session) onSignedIn(); else showAuth();
  sb.auth.onAuthStateChange((_evt, sess)=>{ if(sess) onSignedIn(); else showAuth(); });
})();
</script>
